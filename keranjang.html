<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keranjang – Pojok Gadget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body data-page="keranjang">
  <header class="topbar" id="site-header"></header>

  <main class="page">
    <h1>Keranjang belanja</h1>
    <div class="cart-layout">
      <ul id="items"></ul>
      <aside class="summary">
        <dl id="ringkasan"></dl>
        <form id="form">
          <label>Nama penerima
            <input name="nama" required autocomplete="name">
          </label>
          <label>Alamat pengiriman
            <textarea name="alamat" rows="3" required autocomplete="street-address"></textarea>
          </label>
          <button class="btn" id="pesan" type="submit">Pesan lewat WhatsApp</button>
        </form>
      </aside>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>
</body>
</html>
